<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Kost Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="logo">KOST<span>Manager</span></div>
    <div class="subtitle">Sign in to manage your properties</div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>Username / Email</label>
      <input type="text" placeholder="e.g. admin@kost.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="••••••••">
    </div>
    <div class="meta-row">
      <label style="display:flex; align-items:center; gap:6px; color:#64748b;">
        <input type="checkbox" style="width:auto;"> Remember me
      </label>
      <a href="#">Forgot password?</a>
    </div>
    <button class="btn btn-primary" onclick="window.location.href='main_menu.html'">Login</button>
    <div style="text-align:center; margin-top:16px; font-size:12px; color:#94a3b8;">
      v1.0 &middot; Kost Management System
    </div>
  </div>
</div>
</body>
</html>
